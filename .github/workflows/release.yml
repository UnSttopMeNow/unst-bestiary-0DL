name: Release Creation

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update manifest with jq
        run: |
          jq --arg version "${{ steps.get_version.outputs.VERSION }}" \
             --arg url "https://github.com/${{ github.repository }}" \
             --arg manifest "https://github.com/${{ github.repository }}/releases/latest/download/module.json" \
             --arg download "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip" \
             '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
             module.json > module_temp.json && mv module_temp.json module.json

      - name: Create module.zip
        run: |
          zip -r ./module.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.zip"

      - name: Update Release with Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "module.json,module.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
